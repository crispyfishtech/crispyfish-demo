name: Release
on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cyclyx/semantic-release-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
